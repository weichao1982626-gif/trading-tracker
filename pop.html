<!DOCTYPE html>
<html class="dark" lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <title>25->50 Plan - 收工结算</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#D4AF37",
                        "background-dark": "#121212",
                        "card-bg": "#1A1A1A",
                        "aurora-green": "#00FF88",
                        "carmine-red": "#FF4D4D",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        :root {
            --primary: #D4AF37;
            --background: #121212;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--background);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }
        .gold-glow {
            box-shadow: 0 0 40px rgba(212, 175, 53, 0.08);
        }
        .modal-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7) sepia(1) saturate(2) hue-rotate(10deg);
            opacity: 0.6;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }

        /* 金币掉落动画 */
        .coin-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .coin {
            position: absolute;
            font-size: 24px;
            animation: coinFall 1.5s ease-in forwards;
        }

        @keyframes coinFall {
            0% {
                transform: translateY(-50px) rotate(0deg) scale(0);
                opacity: 0;
            }

            10% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg) scale(0.5);
                opacity: 0;
            }
        }

        .success-flash {
            animation: successFlash 0.5s ease-out;
        }

        @keyframes successFlash {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 60px rgba(0, 255, 136, 0.5);
            }

            100% {
                transform: scale(1);
            }
        }

        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.2) 0%, transparent 70%);
            pointer-events: none;
            z-index: 9998;
            animation: overlayFade 1.5s ease-out forwards;
        }

        @keyframes overlayFade {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body class="bg-background-dark text-white font-display overflow-hidden h-screen flex flex-col">
    <header class="safe-top px-6 pt-12 pb-4 flex justify-between items-end shrink-0">
        <div>
            <h1 class="text-primary text-xs font-bold tracking-[0.2em] uppercase opacity-60">Trading Progress</h1>
            <div class="flex items-baseline gap-2">
                <span class="text-4xl font-extrabold tracking-tighter">25.00</span>
                <span class="text-primary/40 text-xl font-medium">→</span>
                <span class="text-primary/40 text-xl font-medium">50.00</span>
            </div>
        </div>
        <div class="pb-1">
            <div class="bg-primary/10 border border-primary/20 px-3 py-1 rounded-full">
                <span class="text-primary text-xs font-bold tracking-wider">Level 1</span>
            </div>
        </div>
    </header>
    <main class="flex-1 flex flex-col px-6 gap-6 py-4 overflow-hidden">
        <div class="grid grid-cols-2 gap-3 shrink-0">
            <div class="bg-card-bg border border-white/5 p-4 rounded-3xl">
                <p class="text-white/40 text-[10px] font-bold tracking-widest uppercase mb-1">当前资产</p>
                <p id="current-equity" class="text-2xl font-bold tracking-tight">250,000</p>
            </div>
            <div class="bg-card-bg border border-white/5 p-4 rounded-3xl">
                <p class="text-white/40 text-[10px] font-bold tracking-widest uppercase mb-1">今日盈亏</p>
                <p id="today-pnl" class="text-2xl font-bold tracking-tight text-white/50">--</p>
            </div>
        </div>
        <div
            class="flex-1 min-h-[33vh] bg-card-bg border border-white/5 rounded-[2.5rem] relative overflow-hidden flex flex-col">
            <div class="p-6 pb-0 flex justify-between items-center">
                <h3 class="text-xs font-bold tracking-widest text-white/30 uppercase">Equity Curve</h3>
                <span
                    class="text-[10px] font-bold text-primary/60 bg-primary/5 px-2 py-0.5 rounded-md border border-primary/10">REALTIME</span>
            </div>
            <div class="flex-1 relative mt-4">
                <svg class="absolute inset-0 w-full h-full" preserveAspectRatio="none" viewBox="0 0 400 200">
                    <defs>
                        <linearGradient id="grad" x1="0%" x2="0%" y1="0%" y2="100%">
                            <stop offset="0%" style="stop-color:rgba(212, 175, 53, 0.2);stop-opacity:1"></stop>
                            <stop offset="100%" style="stop-color:rgba(18, 18, 18, 0);stop-opacity:1"></stop>
                        </linearGradient>
                    </defs>
                    <path d="M0,160 Q50,150 100,130 T200,100 T300,60 T400,20 L400,200 L0,200 Z" fill="url(#grad)">
                    </path>
                    <path d="M0,160 Q50,150 100,130 T200,100 T300,60 T400,20" fill="none" stroke="#D4AF37"
                        stroke-linecap="round" stroke-width="3"></path>
                </svg>
                <div
                    class="absolute bottom-4 right-4 text-[10px] font-mono text-white/20 flex flex-col items-end gap-1">
                    <span>30000.00</span>
                    <span>25000.00</span>
                </div>
            </div>
        </div>
        <div class="bg-card-bg border border-white/5 p-6 rounded-[2.5rem] shrink-0">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <p class="text-white/40 text-[10px] font-bold tracking-widest uppercase mb-1">当前进度</p>
                    <p id="phase-progress" class="text-xl font-bold italic tracking-tighter">0% 已完成</p>
                </div>
                <div class="text-right">
                    <p class="text-white/40 text-[10px] font-bold tracking-widest uppercase mb-1">目标资产</p>
                    <p class="text-sm font-bold text-primary tracking-tight">500,000</p>
                </div>
            </div>
            <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
                <div id="progress-bar"
                    class="h-full bg-primary w-[0%] rounded-full shadow-[0_0_10px_rgba(212,175,53,0.4)]"></div>
            </div>
        </div>
    </main>

    <!-- 结算弹窗 -->
    <div id="settlement-modal" class="fixed inset-0 bg-black/80 modal-blur flex items-center justify-center p-6 z-50">
        <div class="w-full max-w-sm bg-card-bg border border-primary/20 rounded-[2.5rem] overflow-hidden gold-glow">
            <div class="flex justify-center pt-5">
                <div class="h-1.5 w-12 rounded-full bg-white/10"></div>
            </div>
            <div class="px-8 pt-8 pb-4 text-center">
                <h2 class="text-primary text-2xl font-extrabold tracking-tight">今日收工结算</h2>
            </div>
            <div class="px-8 pb-10">
                <div class="space-y-6">
                    <div
                        class="relative flex items-center justify-center bg-white/5 border border-white/10 rounded-2xl p-3 mt-4">
                        <span class="material-symbols-outlined text-primary/60 text-xl mr-2">calendar_month</span>
                        <input id="settlement-date"
                            class="bg-transparent border-none text-white text-sm font-bold focus:ring-0 p-0 m-0 text-center"
                            type="date" />
                    </div>
                    <div class="relative group">
                        <input id="equity-input"
                            class="w-full bg-transparent border-b-2 border-primary/40 rounded-none py-6 text-4xl font-extrabold text-white placeholder:text-white/10 focus:outline-none focus:border-primary transition-all text-center tracking-tighter"
                            inputmode="decimal" placeholder="今日总资产" type="text" />
                    </div>
                    <div id="preview-pnl" class="text-center py-2 hidden">
                        <p class="text-white/40 text-xs mb-1">预计盈亏</p>
                        <p id="preview-pnl-value" class="text-2xl font-bold">--</p>
                    </div>
                    <div class="flex flex-col gap-3 pt-4">
                        <button id="btn-submit"
                            class="w-full py-5 rounded-2xl bg-primary text-background-dark font-black text-lg shadow-xl shadow-primary/10 active:scale-[0.98] transition-all">
                            确认提交
                        </button>
                        <button id="btn-cancel"
                            class="w-full py-4 rounded-2xl border border-white/5 text-white/30 font-bold text-sm active:bg-white/5 transition-colors">
                            取消
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav
        class="safe-bottom bg-background-dark/80 backdrop-blur-lg border-t border-white/5 px-10 pt-4 pb-8 flex justify-around items-center shrink-0">
        <a class="flex flex-col items-center gap-1 group" href="tongji.html">
            <span
                class="material-symbols-outlined text-white/30 group-active:text-primary transition-colors">history</span>
            <span class="text-[10px] font-bold tracking-widest text-white/30 uppercase">历史</span>
        </a>
        <a class="flex flex-col items-center gap-1 group" href="#">
            <div
                class="h-10 w-10 bg-primary rounded-2xl flex items-center justify-center shadow-lg shadow-primary/20 -mt-2">
                <span class="material-symbols-outlined text-background-dark font-bold">add</span>
            </div>
            <span class="text-[10px] font-bold tracking-widest text-primary uppercase">记一笔</span>
        </a>
        <a class="flex flex-col items-center gap-1 group" href="main.html">
            <span
                class="material-symbols-outlined text-white/30 group-active:text-primary transition-colors">analytics</span>
            <span class="text-[10px] font-bold tracking-widest text-white/30 uppercase">看板</span>
        </a>
    </nav>

    <script>
        // ==================== 核心数据架构 ====================
        const INITIAL_EQUITY = 250000;
        const TARGET_EQUITY = 500000;
        const STORAGE_KEY = 'trade_history';

        function getTradeHistory() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveTradeHistory(history) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        }

        function getLatestEquity() {
            const history = getTradeHistory();
            if (history.length === 0) return INITIAL_EQUITY;
            return history[history.length - 1].equity;
        }

        function getMaxEquity() {
            const history = getTradeHistory();
            if (history.length === 0) return INITIAL_EQUITY;
            return Math.max(INITIAL_EQUITY, ...history.map(h => h.equity));
        }

        function formatNumber(num) {
            return num.toLocaleString('zh-CN');
        }

        // ==================== 初始化页面数据 ====================
        function initPage() {
            const currentEquity = getLatestEquity();
            const history = getTradeHistory();

            // 显示当前资产
            document.getElementById('current-equity').textContent = formatNumber(currentEquity);

            // 显示今日盈亏（如果有记录）
            const todayPnlEl = document.getElementById('today-pnl');
            if (history.length > 0) {
                const latest = history[history.length - 1];
                const isProfit = latest.pnl >= 0;
                const sign = isProfit ? '+' : '';
                todayPnlEl.textContent = `${sign}${formatNumber(latest.pnl)}`;
                todayPnlEl.className = `text-2xl font-bold tracking-tight ${isProfit ? 'text-aurora-green' : 'text-carmine-red'}`;
            }

            // 计算进度
            const progress = Math.max(0, Math.min(100, ((currentEquity - INITIAL_EQUITY) / (TARGET_EQUITY - INITIAL_EQUITY) * 100)));
            document.getElementById('phase-progress').textContent = `${progress.toFixed(1)}% 已完成`;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // 初始化日期为今天
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('settlement-date').value = today;
        }

        // ==================== 实时预览盈亏 ====================
        function updatePreview() {
            const inputEl = document.getElementById('equity-input');
            const previewEl = document.getElementById('preview-pnl');
            const previewValueEl = document.getElementById('preview-pnl-value');

            const inputValue = parseFloat(inputEl.value.replace(/,/g, ''));

            if (!isNaN(inputValue) && inputValue > 0) {
                const currentEquity = getLatestEquity();
                const pnl = inputValue - currentEquity;
                const pnlPercent = (pnl / currentEquity * 100).toFixed(2);
                const isProfit = pnl >= 0;
                const sign = isProfit ? '+' : '';

                previewValueEl.textContent = `${sign}${formatNumber(pnl)} (${sign}${pnlPercent}%)`;
                previewValueEl.className = `text-2xl font-bold ${isProfit ? 'text-aurora-green' : 'text-carmine-red'}`;
                previewEl.classList.remove('hidden');
            } else {
                previewEl.classList.add('hidden');
            }
        }

        // ==================== 提交结算 ====================
        function submitSettlement() {
            const inputEl = document.getElementById('equity-input');
            const dateEl = document.getElementById('settlement-date');

            const newEquity = parseFloat(inputEl.value.replace(/,/g, ''));
            const date = dateEl.value;

            // 验证输入
            if (isNaN(newEquity) || newEquity <= 0) {
                alert('请输入有效的资产金额');
                return;
            }

            if (!date) {
                alert('请选择日期');
                return;
            }

            const history = getTradeHistory();
            const previousEquity = getLatestEquity();
            const maxEquity = Math.max(getMaxEquity(), newEquity);

            // 计算各项指标
            const pnl = newEquity - previousEquity;
            const pnl_percent = (pnl / previousEquity) * 100;
            const drawdown = ((maxEquity - newEquity) / maxEquity) * 100;

            // 检查是否已有该日期的记录
            const existingIndex = history.findIndex(h => h.date === date);

            const record = {
                date: date,
                equity: newEquity,
                pnl: pnl,
                pnl_percent: pnl_percent,
                drawdown: drawdown
            };

            if (existingIndex >= 0) {
                // 更新现有记录
                history[existingIndex] = record;
            } else {
                // 添加新记录
                history.push(record);
            }

            // 按日期排序
            history.sort((a, b) => new Date(a.date) - new Date(b.date));

            // 重新计算所有记录的回撤（因为历史最高可能变化）
            let runningMax = INITIAL_EQUITY;
            history.forEach((item, index) => {
                runningMax = Math.max(runningMax, item.equity);
                item.drawdown = ((runningMax - item.equity) / runningMax) * 100;

                // 重新计算盈亏（相对于前一天）
                const prevEquity = index === 0 ? INITIAL_EQUITY : history[index - 1].equity;
                item.pnl = item.equity - prevEquity;
                item.pnl_percent = (item.pnl / prevEquity) * 100;
            });

            // 保存数据
            saveTradeHistory(history);

            // 如果是盈利，播放金币动画
            if (pnl > 0) {
                playSuccessAnimation(() => {
                    window.location.href = 'main.html';
                });
            } else {
                // 亏损直接跳转
                window.location.href = 'main.html';
            }
        }

        // ==================== 成功动画 ====================
        function playSuccessAnimation(callback) {
            // 创建绿色光晕背景
            const overlay = document.createElement('div');
            overlay.className = 'success-overlay';
            document.body.appendChild(overlay);

            // 创建金币容器
            const container = document.createElement('div');
            container.className = 'coin-container';
            document.body.appendChild(container);

            // 生成金币
            const coinEmojis = ['🪙', '💰', '✨', '🌟', '💵'];
            const coinCount = 30;

            for (let i = 0; i < coinCount; i++) {
                setTimeout(() => {
                    const coin = document.createElement('span');
                    coin.className = 'coin';
                    coin.textContent = coinEmojis[Math.floor(Math.random() * coinEmojis.length)];
                    coin.style.left = Math.random() * 100 + '%';
                    coin.style.animationDelay = (Math.random() * 0.3) + 's';
                    coin.style.fontSize = (20 + Math.random() * 20) + 'px';
                    container.appendChild(coin);
                }, i * 50);
            }

            // 弹窗闪烁效果
            const modal = document.querySelector('.gold-glow');
            if (modal) {
                modal.classList.add('success-flash');
            }

            // 动画结束后跳转
            setTimeout(() => {
                container.remove();
                overlay.remove();
                if (callback) callback();
            }, 1800);
        }

        // ==================== 事件绑定 ====================
        document.addEventListener('DOMContentLoaded', function () {
            initPage();

            // 输入实时预览
            document.getElementById('equity-input').addEventListener('input', updatePreview);

            // 确认提交
            document.getElementById('btn-submit').addEventListener('click', submitSettlement);

            // 取消按钮
            document.getElementById('btn-cancel').addEventListener('click', function () {
                window.location.href = 'main.html';
            });
        });
    </script>

</body>

</html>
