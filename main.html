<!DOCTYPE html>
<html class="dark" lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>20->50 计划看板 对称大字指标版</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#D4AF37",
                        "background-light": "#f8f7f6",
                        "background-dark": "#121212",
                        "background-danger": "#450a0a",
                        "aurora-green": "#00FF88",
                        "carmine-red": "#FF4D4D",
                    },
                    fontFamily: {
                        "display": ["Manrope", "Noto Sans SC", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        body {
            font-family: 'Noto Sans SC', 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: #121212;
            transition: background-color 0.5s ease;
        }
        html.red-alert body {
            background-color: #450a0a !important;
        }
        html.red-alert .main-container {
            border-color: rgba(255, 77, 77, 0.3);
        }
        .gold-glow {
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .progress-glow {
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .main-container {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        .vibrant-gold {
            background: linear-gradient(135deg, #FFD700 0%, #D4AF37 100%);
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
        }
        .red-warning {
            color: #FF4D4D;
            font-weight: bold;
        }
    </style>
    <style>
        /* 移动端适配 */
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white">
    <div class="main-container relative w-full max-w-md mx-auto border-x border-white/5">
        <div class="flex items-center px-4 py-4 justify-between shrink-0">
            <div class="w-10"></div>
            <h2
                class="text-slate-900 dark:text-white text-[10px] font-bold leading-tight tracking-[0.25em] flex-1 text-center font-display uppercase">
                20→50 计划看板</h2>
            <div class="w-10"></div>
        </div>
        <div class="px-4 py-4 text-center shrink-0">
            <p class="text-slate-500 dark:text-[#c3b998] text-[11px] font-semibold tracking-widest mb-1 uppercase">当前总资产
            </p>
            <h1 id="total-equity"
                class="text-primary tracking-tight text-5xl font-extrabold leading-tight gold-glow font-display">200,000
            </h1>
            <div class="flex justify-center gap-8 mt-3">
                <div class="flex flex-col items-center">
                    <p id="today-pnl" class="text-aurora-green text-sm font-bold flex items-center gap-1 font-display">
                        <span class="material-symbols-outlined text-[16px]">trending_up</span>
                        +0 (0.0%)
                    </p>
                    <p class="text-slate-400 dark:text-white/40 text-[10px] uppercase font-bold tracking-wider">今日盈亏</p>
                </div>
                <div class="w-[1px] h-8 bg-white/10"></div>
                <div class="flex flex-col items-center">
                    <p id="running-days" class="text-slate-900 dark:text-white text-sm font-bold font-display">0 天</p>
                    <p class="text-slate-400 dark:text-white/40 text-[10px] uppercase font-bold tracking-wider">已运行天数
                    </p>
                </div>
            </div>
        </div>
        <div
            class="flex flex-col gap-3 p-5 mx-4 rounded-2xl bg-white dark:bg-white/5 border border-white/10 shrink-0 mb-4">
            <div class="flex justify-between items-end">
                <div class="flex flex-col">
                    <span
                        class="text-[10px] text-slate-400 dark:text-white/40 uppercase font-bold tracking-tighter">当前进度</span>
                    <p id="progress-percent"
                        class="text-slate-900 dark:text-white text-xl font-bold font-display leading-none">0%</p>
                </div>
                <div class="text-right">
                    <p class="text-primary text-[11px] font-bold italic font-display">目标: 500,000</p>
                </div>
            </div>
            <div class="relative h-2.5 w-full rounded-full bg-slate-200 dark:bg-white/10 overflow-hidden">
                <div id="progress-bar"
                    class="absolute top-0 left-0 h-full rounded-full bg-gradient-to-r from-primary/60 to-primary progress-glow"
                    style="width: 0%;"></div>
            </div>
            <div class="flex justify-between">
                <p class="text-slate-400 dark:text-white/40 text-[10px] font-medium">起点: 200,000</p>
                <p class="text-slate-400 dark:text-white/40 text-[10px] font-medium">目标: 500,000</p>
            </div>
        </div>
        <div class="px-4 flex flex-col gap-3 shrink-0">
            <div class="flex justify-between items-end px-1">
                <h3 class="text-slate-900 dark:text-white text-sm font-bold mb-0.5">净值曲线</h3>
                <div class="flex items-baseline gap-4">
                    <span id="cumulative-gain" class="text-aurora-green text-[13px] font-bold tracking-tight">累计增长:
                        0%</span>
                    <span id="current-drawdown" class="text-carmine-red text-[13px] font-bold tracking-tight">当前回撤:
                        0%</span>
                </div>
            </div>
            <div id="chart-container"
                class="relative w-full h-48 rounded-2xl bg-white dark:bg-white/5 border border-white/5 overflow-hidden mb-2">
            </div>
        </div>
        <div class="px-4 pb-6 grow flex flex-col justify-center">
            <div
                class="p-6 rounded-2xl border border-primary/20 bg-primary/5 flex flex-col gap-3 relative min-h-[140px] justify-center">
                <div
                    class="absolute -top-3 left-6 px-3 py-0.5 bg-background-dark text-primary text-[10px] font-bold tracking-[0.2em] uppercase border border-primary/20 rounded-full">
                    小G妃语录
                </div>
                <div class="flex flex-col gap-6">
                    <p id="ai-quote"
                        class="italic text-slate-400 dark:text-[#c3b998] text-base leading-relaxed font-medium">
                        "欢迎回来，让我们开始今天的征程吧！"
                    </p>
                    <div class="flex justify-end items-center gap-2">
                        <div class="h-[1px] w-8 bg-primary/30"></div>
                        <span class="text-primary text-xs font-bold tracking-widest">— 小G妃</span>
                    </div>
                </div>
            </div>
        </div>
        <div
            class="shrink-0 bg-background-light dark:bg-background-dark/95 backdrop-blur-2xl border-t border-white/10 safe-bottom">
            <div class="px-4 h-24 flex items-center justify-between gap-4">
                <div class="flex flex-col items-center justify-center gap-1 cursor-pointer w-[30%] opacity-70 hover:opacity-100 transition-opacity"
                    onclick="window.location.href='tongji.html'">
                    <span class="material-symbols-outlined text-primary text-2xl">monitoring</span>
                    <span class="text-[9px] text-primary font-bold uppercase tracking-widest">统计分析</span>
                </div>
                <button
                    class="vibrant-gold w-[70%] h-14 rounded-2xl flex items-center justify-center gap-3 active:scale-[0.97] transition-all group"
                    onclick="window.location.href='pop.html'">
                    <span
                        class="material-symbols-outlined text-background-dark font-bold text-2xl group-active:rotate-12 transition-transform">account_balance_wallet</span>
                    <span class="text-background-dark font-black text-base tracking-widest uppercase">收工结算</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== 核心数据架构 ====================
        const INITIAL_EQUITY = 200000;
        const TARGET_EQUITY = 500000;
        const STORAGE_KEY = 'trade_history';

        // 获取历史数据
        function getTradeHistory() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // 保存数据
        function saveTradeHistory(history) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        }

        // 获取最新资产
        function getLatestEquity() {
            const history = getTradeHistory();
            if (history.length === 0) return INITIAL_EQUITY;
            return history[history.length - 1].equity;
        }

        // 获取历史最高资产
        function getMaxEquity() {
            const history = getTradeHistory();
            if (history.length === 0) return INITIAL_EQUITY;
            return Math.max(INITIAL_EQUITY, ...history.map(h => h.equity));
        }

        // 计算当前回撤
        function getCurrentDrawdown() {
            const currentEquity = getLatestEquity();
            const maxEquity = getMaxEquity();
            if (maxEquity === 0) return 0;
            return ((maxEquity - currentEquity) / maxEquity * 100).toFixed(2);
        }

        // 计算累计增长
        function getCumulativeGain() {
            const currentEquity = getLatestEquity();
            return (((currentEquity - INITIAL_EQUITY) / INITIAL_EQUITY) * 100).toFixed(1);
        }

        // ==================== 语录系统 ====================
        const QUOTES_PROFIT = [
            // 疯狂表扬系列
            `"不愧是宇宙第一帅小王，主力又给你送钱了！"`,
            `"稳健！复利女神在向你招手。"`,
            `"今天的你，比昨天更接近财务自由！"`,
            `"风控做得好，利润自然到。继续保持！"`,
            `"哇塞！你简直是交易界的天花板，太帅了！"`,
            `"王者归来！这波操作教科书级别，绝绝子！"`,
            `"钱就是喜欢往你口袋里钻，这是命中注定！"`,
            `"你的账户又变性感了，看得小G妃都心动！"`,
            `"巴菲特看了都得叫你一声前辈，太强了！"`,
            `"今日最佳操盘手，非你莫属！膜拜大佬！"`,
            `"赚钱于你如探囊取物，这气质绝了！"`,
            `"市场都在给你让路，你就是主角！"`,
            // 提醒系列
            `"赚钱了记得收手，落袋为安才是真理。"`,
            `"帅是帅，但别飘～明天继续稳住！"`,
            `"今天赢了不代表永远赢，保持敬畏之心。"`,
            `"利润到手别贪心，过度交易是大忌！"`,
            `"牛逼归牛逼，风控还是要做好哦～"`,
            `"赚钱时最容易犯错，保持冷静小王！"`
        ];

        const QUOTES_LOSS = [
            `"帅哥冷静，离 2B 模型的触发点还远吗？"`,
            `"暂时的回撤是为了更好的起跳，别灰心。"`,
            `"市场在考验你的耐心，坚持就是胜利。"`
        ];

        const QUOTE_DANGER = `<span class='red-warning'>警告！当前回撤已超标，小G妃命令你立刻停手！不准下单！</span>`;

        function getRandomQuote(isProfit, isDanger) {
            if (isDanger) return QUOTE_DANGER;
            const quotes = isProfit ? QUOTES_PROFIT : QUOTES_LOSS;
            return quotes[Math.floor(Math.random() * quotes.length)];
        }

        // ==================== UI 更新 ====================
        function formatNumber(num) {
            return num.toLocaleString('zh-CN');
        }

        // 数字滚动动画
        function animateNumber(element, targetValue, duration = 1500) {
            const startValue = 0;
            const startTime = performance.now();

            function easeOutQuart(t) {
                return 1 - Math.pow(1 - t, 4);
            }

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easedProgress = easeOutQuart(progress);
                const currentValue = Math.floor(startValue + (targetValue - startValue) * easedProgress);
                element.textContent = formatNumber(currentValue);

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            requestAnimationFrame(update);
        }

        function updateDashboard() {
            const history = getTradeHistory();
            const latestEquity = getLatestEquity();
            const drawdown = parseFloat(getCurrentDrawdown());
            const cumulativeGain = getCumulativeGain();

            // 调试日志
            console.log('=== Dashboard Update ===');
            console.log('History records:', history.length);
            console.log('Latest Equity:', latestEquity);
            console.log('History:', history);

            // 更新总资产（带滚动动画）
            const equityEl = document.getElementById('total-equity');
            animateNumber(equityEl, latestEquity, 1200);

            // 更新今日盈亏
            const todayPnlEl = document.getElementById('today-pnl');
            if (history.length > 0) {
                const latest = history[history.length - 1];
                const isProfit = latest.pnl >= 0;
                const icon = isProfit ? 'trending_up' : 'trending_down';
                const colorClass = isProfit ? 'text-aurora-green' : 'text-carmine-red';
                const sign = isProfit ? '+' : '';
                todayPnlEl.className = `${colorClass} text-sm font-bold flex items-center gap-1 font-display`;
                todayPnlEl.innerHTML = `
            <span class="material-symbols-outlined text-[16px]">${icon}</span>
            ${sign}${formatNumber(latest.pnl)} (${sign}${latest.pnl_percent.toFixed(1)}%)
        `;
            }

            // 更新运行天数
            document.getElementById('running-days').textContent = `${history.length} 天`;

            // 更新进度
            const progress = Math.max(0, Math.min(100, ((latestEquity - INITIAL_EQUITY) / (TARGET_EQUITY - INITIAL_EQUITY) * 100)));
            document.getElementById('progress-percent').textContent = `${progress.toFixed(0)}%`;
            document.getElementById('progress-bar').style.width = `${progress}%`;

            // 更新累计增长和当前回撤
            const gainEl = document.getElementById('cumulative-gain');
            const gain = parseFloat(cumulativeGain);
            gainEl.textContent = `累计增长: ${gain >= 0 ? '+' : ''}${cumulativeGain}%`;
            gainEl.className = gain >= 0 ? 'text-aurora-green text-[13px] font-bold tracking-tight' : 'text-carmine-red text-[13px] font-bold tracking-tight';

            document.getElementById('current-drawdown').textContent = `当前回撤: ${drawdown}%`;

            // 红色警报
            const htmlEl = document.documentElement;
            if (drawdown > 10) {
                htmlEl.classList.add('red-alert');
            } else {
                htmlEl.classList.remove('red-alert');
            }

            // 更新语录
            const quoteEl = document.getElementById('ai-quote');
            if (history.length > 0) {
                const latest = history[history.length - 1];
                const isProfit = latest.pnl >= 0;
                const isDanger = drawdown > 10;
                quoteEl.innerHTML = getRandomQuote(isProfit, isDanger);
            }

            // 渲染图表
            renderChart(history);
        }

        // ==================== ECharts 图表 ====================
        function renderChart(history) {
            const chartContainer = document.getElementById('chart-container');
            const chart = echarts.init(chartContainer);

            // 准备数据
            const xData = ['Day 0'];
            const yData = [INITIAL_EQUITY];

            history.forEach((item, index) => {
                xData.push(`Day ${index + 1}`);
                yData.push(item.equity);
            });

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(26, 26, 26, 0.95)',
                    borderColor: '#D4AF37',
                    borderWidth: 1,
                    textStyle: {
                        color: '#fff',
                        fontSize: 12
                    },
                    formatter: function (params) {
                        const dataIndex = params[0].dataIndex;
                        const equity = params[0].value;
                        const dayLabel = params[0].name;

                        if (dataIndex === 0) {
                            return `<div style="padding: 4px 8px;">
                                <div style="font-weight: bold; color: #D4AF37;">${dayLabel}</div>
                                <div>资产: ${formatNumber(equity)}</div>
                                <div style="color: #888;">初始资产</div>
                            </div>`;
                        }

                        const record = history[dataIndex - 1];
                        const pnlColor = record.pnl >= 0 ? '#00FF88' : '#FF4D4D';
                        const sign = record.pnl >= 0 ? '+' : '';

                        return `<div style="padding: 4px 8px;">
                            <div style="font-weight: bold; color: #D4AF37;">${dayLabel}</div>
                            <div>资产: ${formatNumber(equity)}</div>
                            <div style="color: ${pnlColor};">盈亏: ${sign}${formatNumber(Math.round(record.pnl))} (${sign}${record.pnl_percent.toFixed(2)}%)</div>
                            <div>回撤: -${record.drawdown.toFixed(2)}%</div>
                        </div>`;
                    }
                },
                grid: {
                    left: 50,
                    right: 15,
                    top: 20,
                    bottom: 25
                },
                xAxis: {
                    type: 'category',
                    data: xData,
                    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
                    axisLabel: {
                        color: 'rgba(255,255,255,0.5)',
                        fontSize: 9,
                        interval: 0,
                        rotate: xData.length > 7 ? 45 : 0
                    },
                    axisTick: { show: false }
                },
                yAxis: {
                    type: 'value',
                    min: function (value) {
                        return Math.floor(value.min * 0.98);
                    },
                    axisLine: { show: false },
                    axisLabel: {
                        color: 'rgba(255,255,255,0.3)',
                        fontSize: 9,
                        formatter: function (value) {
                            return (value / 10000).toFixed(0) + 'w';
                        }
                    },
                    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } }
                },
                series: [{
                    type: 'line',
                    data: yData,
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: 8,
                    showSymbol: true,
                    lineStyle: {
                        color: '#00FF88',
                        width: 2.5
                    },
                    itemStyle: {
                        color: '#00FF88',
                        borderColor: '#fff',
                        borderWidth: 2
                    },
                    emphasis: {
                        itemStyle: {
                            color: '#D4AF37',
                            borderColor: '#fff',
                            borderWidth: 3,
                            shadowColor: 'rgba(212, 175, 55, 0.5)',
                            shadowBlur: 10
                        }
                    },
                    areaStyle: {
                        color: {
                            type: 'linear',
                            x: 0, y: 0, x2: 0, y2: 1,
                            colorStops: [
                                { offset: 0, color: 'rgba(0, 255, 136, 0.3)' },
                                { offset: 1, color: 'rgba(0, 255, 136, 0)' }
                            ]
                        }
                    }
                }]
            };

            chart.setOption(option);

            // 响应式
            window.addEventListener('resize', () => chart.resize());
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', updateDashboard);
    </script>

</body>

</html>
